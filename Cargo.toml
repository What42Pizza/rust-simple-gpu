[package]
name = "simple-gpu"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "An abstraction over WGPU inspired by the simplicity of multimedia libraries like raylib and sdl"
repository = "https://github.com/What42Pizza/rust-simple-gpu"
readme = "readme.md"
keywords = [ "gpu", "wgpu", "simple", "rendering", "graphics" ]
categories = [ "multimedia", "rendering", "rendering::graphics-api", "graphics", "game-development" ]

[dependencies]
wgpu = {
	version = "30.*",
	default-features = false,
	features = [ "std", "dx12", "metal", "gles", "vulkan" ],
}
raw-window-handle = {
	version = "0.6.*",
	default-features = false,
}
pollster = {
	version = "1.*",
	default-features = false,
}
anyhow = {
	version = "1.*",
	default-features = false,
	}
bytemuck = {
	version = "1.*",
	default-features = false,
}
image = {
	version = "0.25.*",
	optional = true,
	default-features = false,
	features = [ "png", "jpeg", "webp", "bmp", "tga" ],
}
rectangle-pack = {
	version = "0.4.*",
	optional = true,
}

[features]
default = [ "glsl", "image", "atlas" ]
glsl = [ "wgpu/glsl" ]
wgsl = [ "wgpu/wgsl" ]
image = [ "dep:image" ]
atlas = [ "dep:rectangle-pack" ]

[dev-dependencies]
sdl3 = {
	version = "0.18.*",
	features = [ "raw-window-handle", "build-from-source" ],
}
env_logger = "0.11.*"
glam = {
	version = "0.33.*",
	features = [ "bytemuck" ],
}
log = "0.4.*"
