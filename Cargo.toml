[package]
name = "simple-gpu"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = "An abstraction over WGPU inspired by the simplicity of multimedia libraries like raylib and sdl"
repository = "https://github.com/What42Pizza/rust-simple-gpu"
readme = "readme.md"
keywords = [ "gpu", "wgpu", "simple", "rendering", "graphics" ]
categories = [ "multimedia", "rendering", "rendering::graphics-api", "graphics", "game-development" ]

[dependencies.wgpu]
	version = "29.*" # NOTE: wgpu 30.* seems to have some pretty bad input lag problems
	default-features = false
	features = [ "std", "dx12", "metal", "gles", "vulkan" ]
[dependencies.pollster]
	version = "1.*"
	default-features = false
[dependencies.anyhow]
	version = "1.*"
	default-features = false
[dependencies.bytemuck]
	version = "1.*"
	default-features = false
[dependencies.image]
	version = "0.25.*"
	optional = true
	default-features = false
	features = [ "png", "jpeg", "webp", "bmp", "tga" ]
[dependencies.guillotiere]
	version = "0.7.*"
	optional = true

[features]
default = [ "glsl", "image", "atlas" ]
glsl = [ "wgpu/glsl" ]
wgsl = [ "wgpu/wgsl" ]
image = [ "dep:image" ]
atlas = [ "dep:guillotiere" ]

[dev-dependencies.sdl3]
	version = "0.20.*"
	features = [ "raw-window-handle", "build-from-source" ]
[dev-dependencies.env_logger]
	version = "0.11.*"
[dev-dependencies.glam]
	version = "0.33.*"
	features = [ "bytemuck" ]
[dev-dependencies.log]
	version = "0.4.*"
